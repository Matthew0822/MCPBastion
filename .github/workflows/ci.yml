name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gateway:
    name: Rust gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup component add clippy rustfmt
      - name: Format check
        run: cargo fmt --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release

  console:
    name: TypeScript console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  integration:
    name: Cross-language demo
    runs-on: ubuntu-latest
    needs: [gateway, console]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build gateway
        run: cargo build --release
        working-directory: gateway
      - name: Build console
        run: npm install && npm run build
        working-directory: console
      - name: Run gateway over the demo session
        run: |
          cat sessions/demo-session.jsonl \
            | gateway/target/release/mcp-bastion \
              --policy policies/default.policy \
              --audit /tmp/audit.jsonl --stats --epoch-ms 0 \
            > /tmp/forwarded.jsonl
      - name: Report via the console (fails on summary mismatch)
        run: node console/dist/cli.js report /tmp/audit.jsonl
